name: Keep API awake
# Render's free plan puts the API to sleep after 15 idle minutes, and waking it takes up to a minute.
# A light health check every 10 minutes keeps chat and logins fast. GitHub may delay scheduled runs a little.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --fail --max-time 120 --retry 2 https://hostel-qy5p.onrender.com/api/health
